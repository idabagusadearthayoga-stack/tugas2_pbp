<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
}

nav a {
  text-decoration: none;
  color: white;
  padding: 10px 20px;
  border-radius: 10px;
  transition: 0.3s;
}

nav a:hover {
  background: #22c55e;
  color: black;
  box-shadow: 0 0 10px #22c55e;
}

nav a.active {
  background: #22c55e;
  color: black;
}

/* KALKULATOR */
.calc {
  max-width: 300px;
  margin: 40px auto;
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(34,197,94,0.4);
  transition: 0.3s;
}

.calc:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 25px rgba(34,197,94,0.6);
}

#display {
  width: 100%;
  height: 60px;
  font-size: 24px;
  text-align: right;
  margin-bottom: 10px;
  border-radius: 10px;
  border: none;
  padding: 10px;
  background: #0f172a;
  color: white;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: black;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 10px #22c55e;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">HOME</a>
  <a href="pendidikan.html">PENDIDIKAN</a>
  <a href="skill.html">SKILL</a>
  <a href="form.html">FORM</a>
  <a href="kalkulator.html" class="active">KALKULATOR</a>
</nav>

<div class="calc">
  <input type="text" id="display" disabled>

  <div class="buttons">
    <button onclick="clearDisplay()">C</button>
    <button onclick="hapus()">⌫</button>
    <button onclick="tambah('/')">/</button>
    <button onclick="tambah('*')">*</button>

    <button onclick="tambah('7')">7</button>
    <button onclick="tambah('8')">8</button>
    <button onclick="tambah('9')">9</button>
    <button onclick="tambah('-')">-</button>

    <button onclick="tambah('4')">4</button>
    <button onclick="tambah('5')">5</button>
    <button onclick="tambah('6')">6</button>
    <button onclick="tambah('+')">+</button>

    <button onclick="tambah('1')">1</button>
    <button onclick="tambah('2')">2</button>
    <button onclick="tambah('3')">3</button>
    <button onclick="hitung()">=</button>

    <button onclick="tambah('0')">0</button>
    <button onclick="tambah('.')">.</button>
  </div>
</div>

<script>
let display = document.getElementById("display");

function tambah(value) {
  display.value += value;
}

function clearDisplay() {
  display.value = "";
}

function hapus() {
  display.value = display.value.slice(0, -1);
}

function hitung() {
  try {
    display.value = eval(display.value);
  } catch {
    display.value = "Error";
  }
}
</script>

</body>
</html>
